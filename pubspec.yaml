name: zaznamity
description: "Secure Financial Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  fl_chart: ^0.70.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.2.2
  file_selector: ^1.0.3 

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ZaznamityLogoFULL.jpg
    - assets/ZaznamityLogo_onlyZwhite.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/ZaznamityLogo_onlyZwhite.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "582F95"
  image: "assets/ZaznamityLogo_onlyZwhite.png"
  branding_mode: bottom
  fullscreen: true
  
  android_12:
    color: "582F95"
    image: "assets/ZaznamityLogo_onlyZwhite.png"
    icon_background_color: "582F95"